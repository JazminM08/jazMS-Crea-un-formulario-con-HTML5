<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/60570ec23c.js" crossorigin="anonymous"></script>
  <title>Payment Form Example</title>
</head>

<body>
  <div class="container-fluid bg-white">
    <div class="container border m-0 p-0">
      <div class="bg-light text-bold p-3">
        <h1><strong>Payment Form Example</strong></h1>
      </div>

      <div class="alert alert-danger m-3 p-3 text-left">
        <p>Some fields are missing</p>
      </div>

      <form>
        <!-- Card Info -->
        <div class="row g-2 p-4">
          <div class="col-5 px-2">
            <label for="cardNumber">Card #</label>
            <input type="text" class="form-control" id="cardNumber" placeholder="XXXXXXXXXXXXXXXXX" required>
          </div>
          <div class="col-3 px-5">
            <label for="cvc">CVC #</label>
            <input type="text" class="form-control" id="cvc" placeholder="0000" required>
          </div>
          <div class="col-4 px-2">
            <label for="amount">Amount</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="text" class="form-control" id="amount" placeholder="Amount" required>
            </div>
          </div>
        </div>

        <!-- Name Info -->
        <div class="row g-2 p-5">
          <div class="col-6 px-2">
            <label for="firstName">First Name</label>
            <input type="text" class="form-control" id="firstName" required>
          </div>
          <div class="col-6 px-2">
            <label for="lastName">Last Name</label>
            <input type="text" class="form-control" id="lastName" required>
          </div>
        </div>

        <!-- Address Info -->
        <div class="row g-2 p-4">
          <div class="col-6 px-2">
            <label for="city">City</label>
            <input type="text" class="form-control" id="city" required>
          </div>
          <div class="col-3 px-2">
            <label for="state">State</label>
            <div class="form-floating">
              <select class="form-select" id="state" required>
                <option selected>Pick a state</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
              </select>
            </div>
          </div>
          <div class="col-3 px-2">
            <label for="postalCode">Postal Code</label>
            <input type="text" class="form-control" id="postalCode" required>
          </div>
        </div>

        <!-- Payment Methods -->
        <div class="row g-2 p-4">
          <div class="col-12">
            <label>We accept</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="paymentOption" id="mastercard" value="mastercard" disabled>
              <label class="form-check-label" for="mastercard"><i class="fa-brands fa-cc-mastercard"></i></label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="paymentOption" id="visa" value="visa" disabled>
              <label class="form-check-label" for="visa"><i class="fa-brands fa-cc-visa"></i></label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="paymentOption" id="dinersClub" value="dinersClub" disabled>
              <label class="form-check-label" for="dinersClub"><i class="fa-brands fa-cc-diners-club"></i></label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="paymentOption" id="amex" value="amex" disabled>
              <label class="form-check-label" for="amex"><i class="fa-brands fa-cc-amex"></i></label>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="bg-light border d-flex justify-content-end gap-2 py-2 px-3">
          <button type="button" class="border-0 rounded btn-secondary text-white px-3 py-1">Cancel</button>
          <button type="submit" class="border-0 rounded btn-primary text-white px-3 py-1">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>

</html>
